# إعداد النشر على Render (Blueprint).
# Render يضخّ متغير PORT تلقائياً، والسيرفر يقرأه من config.py ويستمع عليه.
services:
  - type: web
    name: secure-chat
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /chat
    envVars:
      - key: HOST
        value: 0.0.0.0
      # كلمة مرور لوحة التحكم (/settings و /api/*). بدونها يولّد السيرفر
      # كلمة عشوائية عند كل تشغيل — وهو ما يجعل اللوحة غير قابلة للوصول عملياً.
      # اضبطها من لوحة Render (Environment) بعد إنشاء الخدمة.
      - key: ADMIN_PASSWORD
        sync: false
      # مفاتيح التبديل التعليمية (يمكن تغييرها من لوحة التحكم أثناء التشغيل)
      - key: ENCRYPTION
        value: "1"
      - key: CIPHER
        value: AES-GCM
      - key: INTEGRITY
        value: "1"
      - key: AUTHENTICATION
        value: "1"
      - key: KEY_EXCHANGE
        value: ECDH
